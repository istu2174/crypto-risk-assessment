# Blueprint Render — definisi service backend (Express + Prisma).
# Dipakai lewat menu "New > Blueprint" di dashboard Render.
# Env var yang bertanda `sync: false` = rahasia, TIDAK disimpan di file ini
# dan bakal ditanyain Render pas pertama kali deploy.

services:
  - type: web
    name: crypto-risk-assessment
    runtime: node
    plan: free
    # Singapore = region terdekat dari Indonesia sekaligus sama dengan region
    # database Neon, jadi latency query kecil.
    region: singapore
    # Monorepo: kode backend ada di subfolder server/
    rootDir: server
    buildCommand: npm install && npm run build
    startCommand: npm start
    # Endpoint ringan yang selalu 200 (gak nyentuh DB) — lihat src/server.js
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production

      # Origin frontend yang diizinkan CORS. Boleh lebih dari satu (pisah koma):
      # domain utama Vercel + alias yang dibikin otomatis sama Vercel.
      - key: FRONTEND_URL
        value: https://crypto-risk-assessment.vercel.app,https://crypto-risk-assessment-istu.vercel.app

      - key: JWT_EXPIRES_IN
        value: 7d

      # Throttle enrich CoinGecko saat scan (biar gak kena rate limit free tier)
      - key: SCAN_CONCURRENCY
        value: "3"

      # === Rahasia — diisi manual di dashboard, JANGAN ditulis di file ini ===
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: COINGECKO_API_KEY
        sync: false
      - key: HELIUS_API_KEY
        sync: false
      - key: ALCHEMY_API_KEY
        sync: false
